services:

  # ─────────────────────────────────────────
  # NGINX — einziger Port nach außen (80/443)
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
      - n8n
    networks:
      - saas

  # ─────────────────────────────────────────
  # FRONTEND — Vite App (dein /frontend Ordner)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api
    volumes:
      - ./frontend:/app          # live: Änderungen sofort sichtbar
      - /app/node_modules        # node_modules nicht überschreiben
    networks:
      - saas

  # ─────────────────────────────────────────
  # BACKEND — FastAPI (dein /backend Ordner)
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      - SUPABASE_URL=http://supabase-kong:8000
      - SUPABASE_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_URL=redis://redis:6379
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook
      - SECRET_KEY=${BACKEND_SECRET_KEY}
    volumes:
      - ./backend:/app           # live: Änderungen sofort sichtbar
    depends_on:
      - redis
      - supabase-db
    networks:
      - saas

  # ─────────────────────────────────────────
  # N8N — Automation
  # ─────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost/n8n/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=supabase-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=Europe/Zurich
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - supabase-db
    networks:
      - saas

  # ─────────────────────────────────────────
  # SUPABASE — Postgres DB
  # ─────────────────────────────────────────
  supabase-db:
    image: supabase/postgres:15.1.0.147
    container_name: supabase-db
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
    networks:
      - saas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  supabase-kong:
    image: kong:2.8.1
    container_name: supabase-kong
    restart: unless-stopped
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/var/lib/kong/kong.yml
      - KONG_DNS_ORDER=LAST,A,CNAME
      - KONG_PLUGINS=request-transformer,cors,key-auth,acl
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml:ro
    networks:
      - saas

  supabase-auth:
    image: supabase/gotrue:v2.151.0
    container_name: supabase-auth
    restart: unless-stopped
    environment:
      - GOTRUE_API_HOST=0.0.0.0
      - GOTRUE_API_PORT=9999
      - GOTRUE_DB_DRIVER=postgres
      - DATABASE_URL=postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      - GOTRUE_SITE_URL=${SITE_URL}
      - GOTRUE_URI_ALLOW_LIST=${ADDITIONAL_REDIRECT_URLS}
      - GOTRUE_DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}
      - GOTRUE_JWT_SECRET=${JWT_SECRET}
      - GOTRUE_JWT_EXP=3600
      - GOTRUE_SMTP_HOST=mailpit
      - GOTRUE_SMTP_PORT=1025
      - GOTRUE_SMTP_SENDER_NAME=${SMTP_SENDER_NAME:-SaaS App}
      - GOTRUE_MAILER_AUTOCONFIRM=${MAILER_AUTOCONFIRM:-false}
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - saas

  supabase-rest:
    image: postgrest/postgrest:v12.0.2
    container_name: supabase-rest
    restart: unless-stopped
    environment:
      - PGRST_DB_URI=postgres://authenticator:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      - PGRST_DB_SCHEMAS=public,storage,graphql_public
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=${JWT_SECRET}
      - PGRST_DB_USE_LEGACY_GUCS=false
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - saas

  # ─────────────────────────────────────────
  # REDIS — Cache & Queue
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - saas
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # MAILPIT — E-Mail (Dev: Web UI auf /mail)
  # Für Produktion: SMTP_HOST/PORT auf externen
  # Dienst (z.B. Resend, Postmark) zeigen lassen
  # ─────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    environment:
      - MP_MAX_MESSAGES=500
      - MP_DATA_FILE=/data/mailpit.db
    volumes:
      - mailpit_data:/data
    networks:
      - saas

# ─────────────────────────────────────────
# VOLUMES — persistente Daten
# ─────────────────────────────────────────
volumes:
  supabase_db_data:
  redis_data:
  n8n_data:
  mailpit_data:

# ─────────────────────────────────────────
# NETWORK
# ─────────────────────────────────────────
networks:
  saas:
    driver: bridge
